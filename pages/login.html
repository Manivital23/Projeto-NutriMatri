<!doctype html>
<html lang="pt br">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="..//css/login.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body>
    <header>
      <a href="#"
        ><img
          width="50"
          height="50"
          src="https://img.icons8.com/ios-filled/50/long-arrow-left.png"
          alt="long-arrow-left"
      /></a>
      <img src="../assets/imgs/logo.svg" alt="" />
    </header>
    <main>
      <img class="img-login" src="../assets/imgs/imglogin.png" alt="" />
      <div class="container">
        <h1>Login</h1>
        <form>
          <div class="input-user">
            <label for="email">E-mail</label>
            <input type="email" id="email" />
          </div>
          <div class="input-user">
            <label for="senha">Senha</label>
            <input type="password" id="senha" />

            <img src="../assets/imgs/olhoFechado.svg" id="olho" alt="Mostrar senha" />
          </div>
          <div class="separador">
            <span class="span">──────────</span>
            OU
            <span class="span">──────────</span>
          </div>
          <a href="#" class="google"
            ><img src="../assets/imgs/google.svg" alt="google"
          /></a>
          <div class="box-login">
            <a href="#" class="login">Login</a>
          </div>
          <div class="Cadastre-se">
            <p>
              Cadastre-se | <a href="#">Profissional</a> - <a href="#">Mãe</a>
            </p>
          </div>
        </form>
      </div>
    </main>

    <script src="../js/senha.js"></script>
  </body>
</html>
